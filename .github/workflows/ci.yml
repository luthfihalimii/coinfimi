name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libcjson-dev pkg-config

      - name: Build
        run: make

      - name: Unit tests
        run: make test

      - name: UI smoke test
        run: make test-ui
